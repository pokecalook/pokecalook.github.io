name: Generate Tweet Texts

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk >/dev/null 2>&1
          pip install Pillow playwright
          playwright install --with-deps chromium

      - name: Download price cache from release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release download price-cache \
            --pattern 'price_data_api.json' \
            --pattern 'box_price_data.json' \
            --dir . \
            --clobber 2>/dev/null || echo "No cache found"

      - name: Generate index chart image
        run: python step5_index.py

      - name: Generate tweet texts
        run: |
          for i in 1 2 3; do
            python step4_tweet.py && break
            echo "Tweet生成失敗 (try $i)、5分待機..."
            sleep 300
          done

      - name: Take screenshots for tweets
        run: python step4_screenshot.py

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tweets.html posted_tweets.json images/tw_*
          git diff --staged --quiet || {
            git commit -m "Update tweet texts $(date -u +%Y-%m-%d)"
            for i in 1 2 3; do
              if git push; then
                echo "Push成功 (try $i)"
                break
              fi
              echo "Push失敗、rebase 実行 (try $i)"
              git pull --rebase --autostash origin main || {
                echo "Rebase conflict detected, resolving with theirs..."
                git checkout --theirs tweets.html posted_tweets.json 2>/dev/null || true
                git checkout --theirs images/tw_* 2>/dev/null || true
                git add -A
                GIT_EDITOR=true git rebase --continue || git rebase --skip
              }
              if [ $i -eq 3 ]; then
                echo "最大試行回数に達しました"
                exit 1
              fi
            done
          }

      - name: Trigger deploy
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run deploy-pages.yml --ref main
