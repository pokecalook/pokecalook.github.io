name: Update Prices

on:
  schedule:
    # 毎日 日本時間 6:00 (UTC 21:00 前日)
    - cron: '0 21 * * *'
  workflow_dispatch: # 手動実行も可能

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 180  # step2が長いので3時間

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Download price cache from release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 最新のキャッシュリリースからダウンロード
          gh release download price-cache \
            --pattern 'price_data_api.json' \
            --dir . \
            --clobber 2>/dev/null || echo "No cache found, starting fresh"

      - name: Step 1 - Collect product links
        run: python step1_collect_links.py --pages 500

      - name: Step 2 - Fetch price data via API
        run: python step2_api.py

      - name: Step 3 - Generate HTML report
        run: python step3_report.py

      - name: Copy report to index.html
        run: cp report.html index.html

      - name: Upload price cache to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # キャッシュをGitHub Releaseにアップロード（リポジトリ肥大化防止）
          gh release delete price-cache --yes 2>/dev/null || true
          gh release create price-cache \
            --title "Price Data Cache" \
            --notes "Auto-updated price cache (do not delete)" \
            price_data_api.json product_links.json

      - name: Commit and push index.html
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --staged --quiet || {
            git commit -m "Update prices $(date -u +%Y-%m-%d)"
            git push
          }

